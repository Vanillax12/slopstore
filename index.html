<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Slop Store</title>
  <meta name="description" content="a store for homemade slop">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>slop store</h1>
      <p>100% homemade slop. probably works.</p>
    </div>
    <a class="github-link" id="githubLink" href="#" target="_blank" rel="noopener">github</a>
  </header>

  <main>
    <section class="controls">
      <input id="search" type="search" placeholder="search the slop..." autocomplete="off">
      <span id="count">loading slop...</span>
    </section>

    <section id="status" class="status">detecting apps...</section>
    <section id="apps" class="apps" aria-live="polite"></section>
  </main>

  <footer>
    <span>slop store :3</span>
    <span>powered by github pages</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
